<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GovTECH - Cadastro</title>
  <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="login.html">GovTECH</a>
  </header>

  <main class="auth-page">
    <section class="form-panel">
      <h1>Cadastro</h1>
      <p class="auth-subtitle">Crie sua conta para usar o sistema</p>

      <form id="form-cadastro" class="request-form" novalidate>
        <div class="form-field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-field">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" placeholder="Seu nome" required>
        </div>

        <div class="form-field">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" placeholder="Crie uma senha" required>
        </div>

        <div class="form-field">
          <label for="confirma-senha">Confirmar senha</label>
          <input id="confirma-senha" name="confirma-senha" type="password" placeholder="Repita a senha" required>
        </div>

        <div class="form-field">
          <label for="perfil">Tipo de perfil</label>
          <select id="perfil" name="perfil" required>
            <option value="">Selecione</option>
            <option value="CIDADAO">Cidadão</option>
            <option value="PRESTADOR">Prestador de serviço</option>
          </select>
        </div>

        <p id="error-msg" class="feedback-msg error"></p>
        <p id="success-msg" class="feedback-msg success">Cadastro realizado! Redirecionando para o login...</p>

        <div class="form-actions">
          <button class="primary-button" type="submit" style="width: 100%;">Cadastrar</button>
        </div>
      </form>

      <p class="auth-link">Já tem conta? <a href="login.html">Entrar</a></p>
    </section>
  </main>

  <footer class="footer">
    <p>@2026 AEP Todos Os direitos reservados</p>
    <a href="#">Politica de privacidade</a>
  </footer>

  <script src="../JS/app.js"></script>
  <script src="../JS/cadastro.js"></script>
</body>
</html>
